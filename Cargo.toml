[workspace]
resolver = "2"
members = [
    "crates/strata_router",
    "crates/strata_i18n",
    "crates/strata_store",
    "crates/strata_crdt",
]

[workspace.package]
version = "0.1.0"
authors = ["Strata Contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/strataui/kit"
homepage = "https://github.com/strataui/kit"
documentation = "https://docs.rs/strata-router"
keywords = ["router", "i18n", "store", "crdt", "strata"]
categories = ["gui", "web-programming"]

[workspace.dependencies]
strata-dom = "0.1.4"
strata-macro = "0.1.4"
strata-storage = "0.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
opt-level = 1
